[project]
name = "you-generalize-funny"
version = "0.1.0"
description = "In-context weird-generalization experiments on Talkie (pre-1931) vs its FineWeb twin"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Cluster: sampling and logprob scoring. Reuses talkie-evals' model code, LoRA loader and converter.
gpu = [
  "torch==2.9.0",
  "talkie-trait-lab",
]
# Laptop: Claude judge, conditioning-set generation, analysis and plots.
local = ["anthropic>=1.0", "pydantic>=2", "pandas>=2", "matplotlib>=3.9", "numpy>=2"]

[project.scripts]
ygf = "ygf.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ygf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same torch build as talkie-evals (2.9.0+cu130), so numerics match its validated runs.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
talkie-trait-lab = { path = "../talkie-evals/talkie-trait-lab", editable = true }
